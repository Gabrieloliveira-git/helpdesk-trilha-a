services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_DB: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copie .env.example para .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  dados:
